[project]
name = "archpilot-backend"
version = "0.1.0"
description = "Local multi-agent architecture decision engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.141.1",
  "pydantic-ai-slim[openai]==2.49.0",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
