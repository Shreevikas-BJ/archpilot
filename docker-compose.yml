services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: archpilot
      POSTGRES_USER: archpilot
      POSTGRES_PASSWORD: archpilot
    ports:
      # Keep Docker separate from Windows PostgreSQL on 5432; local access only.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -v ON_ERROR_STOP=1 -c 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
    restart: unless-stopped

volumes:
  postgres_data:
